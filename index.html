<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор проекта</title>

<style>

body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  padding:20px;
  margin:0;
}

.card{
  background:#e9e9e9;
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
}

h2,h3,h4{
  margin-bottom:10px;
}

.input,
select{
  padding:8px 12px;
  border-radius:12px;
  border:none;
  background:#d6d6d6;
}

.row{
  display:flex;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap;
  align-items:center;
}

.service{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
  flex-wrap:wrap;
}

.unit{
  font-size:12px;
  color:#666;
}

.btn{
  background:#ff4d4d;
  border:none;
  padding:8px 20px;
  border-radius:12px;
  color:white;
  cursor:pointer;
  margin-top:10px;
  margin-right:10px;
}

.designer{
  background:white;
  border-radius:20px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:20px;
}

.header{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

.designer-photo{
  width:120px;
  aspect-ratio:3/4;
  border-radius:14px;
  overflow:hidden;
  flex-shrink:0;
}

.designer-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.header-info{
  display:flex;
  flex-direction:column;
  gap:8px;
  flex:1;
}

.title-line{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.title-line h3{
  margin:0;
}

.city{
  background:#6d35ff;
  color:white;
  padding:5px 12px;
  border-radius:12px;
  font-size:12px;
  font-weight:bold;
}

.tags-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.tag{
  padding:6px 12px;
  border-radius:12px;
  font-size:12px;
  color:white;
  white-space:nowrap;
}

.tag-green{
  background:#00b578;
}

.tag-blue{
  background:#132e7c;
}

.tag-orange{
  background:#ff7b22;
}

.calc-row{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.service-line{
  display:flex;
  justify-content:flex-start;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.rate{
  font-size:13px;
  font-weight:bold;
}

.amount-box{
  background:#d6d6d6;
  padding:8px 12px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
}

.amount-box-disabled{
  background:#FFAFC1;
  color:#7a2f4b;
}

/* Кликабельный фрейм */
.amount-box-clickable{
  cursor:pointer;
  transition: background 0.15s;
  user-select: none;
}

.amount-box-clickable:hover{
  background:#c8c8c8;
}

.amount-box-clickable.active{
  background:#b8b8b8;
  border-radius:10px 10px 0 0;
}

/* Иконка-стрелка */
.amount-box-clickable .toggle-icon{
  font-size:11px;
  color:#555;
  margin-left:6px;
  transition: transform 0.2s;
  display:inline-block;
}

.amount-box-clickable.active .toggle-icon{
  transform: rotate(180deg);
}

/* Карусель */
.carousel-wrap{
  display:none;
  background:#c4c4c4;
  border-radius:0 0 10px 10px;
  padding:10px;
  overflow:hidden;
}

.carousel-wrap.open{
  display:block;
}

.carousel{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  padding-bottom:4px;
}

.carousel::-webkit-scrollbar{
  height:4px;
}

.carousel::-webkit-scrollbar-track{
  background:#b0b0b0;
  border-radius:2px;
}

.carousel::-webkit-scrollbar-thumb{
  background:#888;
  border-radius:2px;
}

.carousel-item{
  flex:0 0 auto;
  width:160px;
  height:110px;
  border-radius:8px;
  overflow:hidden;
  scroll-snap-align:start;
  background:#aaa;
}

.carousel-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.total{
  margin-top:10px;
  font-weight:bold;
  font-size:22px;
}

.supervision-badge{
  margin-top:10px;
  display:inline-block;
  background:#00aaff;
  color:white;
  padding:8px 14px;
  border-radius:10px;
  font-size:14px;
  font-weight:normal;
}

.contact-btn{
  margin-top:10px;
  background:#00aaff;
  padding:12px 18px;
  border-radius:12px;
  color:white;
  border:none;
  cursor:pointer;
  font-size:14px;
}

.small-input{
  width:60px;
}

@media (max-width:768px){

  .header{
    flex-direction:column;
  }

  .designer-photo{
    width:100%;
    max-width:220px;
  }

  .carousel-item{
    width:130px;
    height:90px;
  }

}

</style>
</head>

<h2>

Калькулятор проекта

<button class="btn" onclick="generateShareLink()">
Поделиться

</h2>

<div class="row">

<label>Город:</label>

<div class="card">

<div class="row">

<div class="row">

<label>Сортировать:</label>

<select id="sort">
<option value="desc">Сначала дороже</option>
<option value="asc" selected>Сначала дешевле</option>
</select>

</div>

<button class="btn" onclick="calculate()">
Подобрать дизайнера
</button>

<div style="height:20px;"></div>

<div id="results"></div>

</div>

    ]
  }

/* Генерация HTML карусели */
function buildCarousel(designerId, serviceKey){

  const photos = portfolioPhotos[designerId]?.[serviceKey];

  if(!photos || photos.length === 0) return "";

  const items = photos.map(url =>
    `
    <div class="carousel-item">
      <img
        src="${url}"
        loading="lazy"
        onclick="openImageModal('${url}')"
      >
    </div>
    `
  ).join("");

  return `
  <div class="carousel-wrap">
    <div class="carousel">
      ${items}
    </div>
  </div>
  `;

}

/* Переключение карусели */
function toggleCarousel(boxEl){

  const wrap = boxEl.nextElementSibling;

  if(!wrap || !wrap.classList.contains("carousel-wrap")) return;

  const isOpen = wrap.classList.contains("open");

  wrap.classList.toggle("open", !isOpen);
  boxEl.classList.toggle("active", !isOpen);

}

const designersData = [

{
name:"Гринева Лада",
id:"52-00001",
city:"Ставрополь, Ростов-на-Дону, Батайск",

feature1:"Работаю только онлайн",
feature2:["Могу выехать на замер","Работаю по договору"],
objects:["Дом","Квартира","Коммерция"],
minArea:"От 35 кв.м",

rates:{

docs:800,

}

{

feature1:"Работаю только онлайн",
feature2:["Есть свой замерщик","Работаю по договору"],
objects:["Дом","Квартира"],
minArea:"От 10 кв.м",
minBudget:"От 5000 руб",
rates:{
measure:110,
docs:580,
visual:800,
table:250,
collageType:"view",
collage:3000,
supervision:0
}
}

];

window.onload = function(){

const params = new URLSearchParams(window.location.search);

fields.forEach(id=>{

const el = document.getElementById(id);

if(!el) return;

const value = params.get(id);

if(value !== null){

if(el.type === "checkbox"){
el.checked = value === "true";
}else{
el.value = value;
}

}

});

calculate();

};

function generateShareLink(){

const params = new URLSearchParams();

fields.forEach(id=>{

const el = document.getElementById(id);

if(!el) return;

if(el.type === "checkbox"){
params.set(id, el.checked);
}else{
params.set(id, el.value);
}

});

const url =
window.location.origin +
window.location.pathname +
"?" +
params.toString();

navigator.clipboard.writeText(url);

alert("Ссылка скопирована!");

}

function calculate(){

const placement =
parseFloat(document.getElementById("placement").value);

const placementText =
document.getElementById("placement").options[
document.getElementById("placement").selectedIndex
].text;

const selectedCity =
document.getElementById("city").value;

const phone =
document.getElementById("phone").value;

const type =
document.getElementById("type").value;

const budgetMin =
parseFloat(document.getElementById("budgetMin").value) || 0;

const budgetMax =
parseFloat(document.getElementById("budgetMax").value) || Infinity;

const sortOrder =
document.getElementById("sort").value;

const results = [];

designersData.forEach(designer=>{

if(
selectedCity !== "Все города" &&
!designer.city.includes(selectedCity)
){
return;
}

if(
type !== "Не важно" &&
!designer.objects.includes(type)
){
return;
}

let total = 0;
let hasUnavailableService = false;

/* Строит фрейм + карусель под ним */
function getServiceBox(serviceName, serviceKey, rate, quantityText, value){

const isUnavailable = rate === 0;

if(!isUnavailable){
total += value;
}else{
hasUnavailableService = true;
}

/* Для недоступных — обычный фрейм без карусели */
if(isUnavailable){
return `
<div class="calc-row">
<div class="service-line">
<span>${serviceName}</span>
<span class="rate">Не оказывается</span>
</div>
<div class="amount-box amount-box-disabled">
<span>${quantityText}</span>
<span>не оказывается</span>
</div>
</div>
`;
}

const carousel = buildCarousel(designer.id, serviceKey);

return `
<div class="calc-row">
<div class="service-line">
<span>${serviceName}</span>
<span class="rate">${rate} ₽/м²</span>
</div>
<div class="amount-box amount-box-clickable ${serviceKey === "visual" ? "active" : ""}" onclick="toggleCarousel(this)">
<span>${quantityText}</span>
<span>${Math.round(value)} ₽ <span class="toggle-icon">▼</span></span>
</div>
${carousel}
</div>
`;

}

let servicesHtml = "";

if(measure.checked){

servicesHtml += getServiceBox(
"Обмер",
"measure",
designer.rates.measure,
`${area1.value} кв.м`,
area1.value * designer.rates.measure * placement
);

}

if(docs.checked){

servicesHtml += getServiceBox(
"Документация",
"docs",
designer.rates.docs,
`${area2.value} кв.м`,
area2.value * designer.rates.docs * placement
);

}

if(visual.checked){

servicesHtml += getServiceBox(
"3D-визуализация",
"visual",
designer.rates.visual,
`${area3.value} кв.м`,
area3.value * designer.rates.visual * placement
);

}

if(table.checked){

servicesHtml += getServiceBox(
"Таблица комплектации",
"table",
designer.rates.table,
`${areaTable.value} кв.м`,
areaTable.value * designer.rates.table
);

}

if(collage.checked){

const collageValue =
designer.rates.collageType === "m2"
? collageArea.value * designer.rates.collage
: collageCount.value * designer.rates.collage;

const collageQuantity =
designer.rates.collageType === "m2"
? `${collageArea.value} кв.м`
: `${collageCount.value} ракурсов`;

const collageRate =
designer.rates.collageType === "m2"
? designer.rates.collage + " ₽/м²"
: designer.rates.collage + " ₽/ракурс";

const isUnavailable = designer.rates.collage === 0;

if(!isUnavailable){
total += collageValue;
}else{
hasUnavailableService = true;
}

if(isUnavailable){

servicesHtml += `
<div class="calc-row">
<div class="service-line">
<span>2D-коллажи</span>
<span class="rate">Не оказывается</span>
</div>
<div class="amount-box amount-box-disabled">
<span>${collageQuantity}</span>
<span>не оказывается</span>
</div>
</div>
`;

}else{

const carousel = buildCarousel(designer.id, "collage");

servicesHtml += `
<div class="calc-row">
<div class="service-line">
<span>2D-коллажи</span>
<span class="rate">${collageRate}</span>
</div>
<div class="amount-box amount-box-clickable" onclick="toggleCarousel(this)">
<span>${collageQuantity}</span>
<span>${Math.round(collageValue)} ₽ <span class="toggle-icon">▼</span></span>
</div>
${carousel}
</div>
`;

}

}

let supervisionValue = 0;

if(supervision.checked){

const isUnavailable = designer.rates.supervision === 0;

if(!isUnavailable){
supervisionValue = designer.rates.supervision;
}else{
hasUnavailableService = true;
}

servicesHtml += `
<div class="calc-row">

<div class="service-line">
<span>Авторский надзор</span>
<span class="rate">
${isUnavailable ? "Не оказывается" : designer.rates.supervision + " ₽/мес."}
</span>
</div>

<div class="amount-box ${isUnavailable ? "amount-box-disabled" : ""}">
<span>1 месяц</span>
<span>
${isUnavailable ? "не оказывается" : designer.rates.supervision + " ₽"}
</span>
</div>

</div>
`;

}

if(total < budgetMin || total > budgetMax){
return;
}

const servicesText = [];

const designerFeatures = [
designer.feature1,
...designer.feature2
].join(", ");

const designerObjects =
designer.objects.join(", ");

function addServiceLine(
serviceName,
rate,
area,
value,
unit = "м²"
){

if(rate === 0){

servicesText.push(
`${serviceName}=услуга не оказывается`
);

return;

}

servicesText.push(
`${serviceName}=(${rate}₽/${unit})*${area}${unit === "ракурс" ? " ракурсов" : "кв.м"}=${Math.round(value)}₽`
);

}

if(measure.checked){

const value =
area1.value * designer.rates.measure * placement;

addServiceLine(
"Обмер",
designer.rates.measure,
area1.value,
value
);

}

if(docs.checked){

const value =
area2.value * designer.rates.docs * placement;

addServiceLine(
"Документация",
designer.rates.docs,
area2.value,
value
);

}

if(visual.checked){

const value =
area3.value * designer.rates.visual * placement;

addServiceLine(
"3D-визуализация",
designer.rates.visual,
area3.value,
value
);

}

if(table.checked){

const value =
areaTable.value * designer.rates.table;

addServiceLine(
"Таблица комплектации",
designer.rates.table,
areaTable.value,
value
);

}

if(collage.checked){

const collageValue =
designer.rates.collageType === "m2"
? collageArea.value * designer.rates.collage
: collageCount.value * designer.rates.collage;

if(designer.rates.collage === 0){

servicesText.push(
`2D-коллажи=услуга не оказывается`
);

}else{

if(designer.rates.collageType === "m2"){

servicesText.push(
`2D-коллажи=(${designer.rates.collage}₽/м²)*${collageArea.value}кв.м=${Math.round(collageValue)}₽`
);

}else{

servicesText.push(
`2D-коллажи=(${designer.rates.collage}₽/ракурс)*${collageCount.value} ракурсов=${Math.round(collageValue)}₽`
);

}

}

}

if(supervision.checked){

if(designer.rates.supervision === 0){

servicesText.push(
`Авторский надзор=услуга не оказывается`
);

}else{

servicesText.push(
`Авторский надзор=${designer.rates.supervision}₽/мес`
);

}

}

const telegramMessage =
`Значения калькулятора:
Город: ${selectedCity}
Телефон: ${phone}
Расположение: ${placementText}
Тип: ${type}

Карточка дизайнера №${designer.id}

Город: ${designer.city}
Особенности: ${designerFeatures}
Объекты: ${designerObjects}


Расчет стоимости:
${servicesText.join("\n")}

Итого: ${Math.round(total)}₽${
supervision.checked &&
designer.rates.supervision > 0
? ` [+ ${designer.rates.supervision}₽/мес авторский надзор]`
: ""
}`;



const telegramUrl =
"https://t.me/ikushko?text=" +
encodeURIComponent(telegramMessage);

const feature2Html =
designer.feature2.map(item =>
`<span class="tag tag-green">${item}</span>`
).join("");

const objectsHtml =
designer.objects.map(item =>
`<span class="tag tag-blue">${item}</span>`
).join("");

const html = `
<div class="designer">

<div class="header">

<div class="designer-photo">
<img src="${designer.photo}">
</div>

<div class="header-info">

<div class="title-line">
<h3>${designer.name} ${designer.id}</h3>
<span class="city">${designer.city}</span>
</div>

<div class="tags-row">
<span class="tag tag-green">${designer.feature1}</span>
</div>

<div class="tags-row">
${feature2Html}
</div>

<div class="tags-row">
${objectsHtml}
</div>

<div class="tags-row">
<span class="tag tag-orange">${designer.minArea}</span>
<span class="tag tag-orange">${designer.minBudget}</span>
</div>

</div>

</div>

<h4>Расчет стоимости:</h4>

${servicesHtml}

<div class="total">

Итого: ${Math.round(total)} ₽

${
supervision.checked && supervisionValue > 0
? `
<div class="supervision-badge">
+ ${Math.round(supervisionValue)} ₽/мес
</div>
`
: ""
}

</div>

<div style="display:flex; gap:10px; flex-wrap:wrap;">

<a href="${telegramUrl}" target="_blank">
<button class="contact-btn">
Telegram
</button>
</a>

<a href="https://max.ru/u/f9LHodD0cOLwih9TXRbAmf8nJ6SzGEFpeNShCg9ahY-zZlbpJjzGzLRkTk8?text=${encodeURIComponent(telegramMessage)}" target="_blank">
<button class="contact-btn">
MAX
</button>
</a>

</div>

</div>
`;

results.push({
html,
total,
hasUnavailableService
});

});

results.sort((a,b)=>{

if(a.hasUnavailableService !== b.hasUnavailableService){
return a.hasUnavailableService ? 1 : -1;
}

return sortOrder === "asc"
? a.total - b.total
: b.total - a.total;

});

document.getElementById("results").innerHTML =

results.length > 0

? results.map(d=>d.html).join("")

: "<p>Нет дизайнеров по выбранным параметрам</p>";

}

function openImageModal(src){

  const modal =
  document.getElementById("imageModal");

  const image =
  document.getElementById("modalImage");

  image.src = src;

  modal.classList.add("open");

}

function closeImageModal(){

  document
  .getElementById("imageModal")
  .classList.remove("open");

}

/* закрытие по клику на фон */

document.addEventListener("click", function(e){

  const modal =
  document.getElementById("imageModal");

  if(e.target === modal){
    closeImageModal();
  }

});
